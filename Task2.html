<!DOCTYPE html>
<html>

<head>

    <title>Registration Form</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            margin:0;
            padding:0;
            background:#f2f2f2;
            font-family:'Times New Roman', serif;
        }

        .main{
            width:420px;
            background:#efefef;
            margin:8px auto;
            padding:18px 20px 20px 20px;
            border-radius:10px;
        }

        fieldset{
            border:1px solid black;
            padding:10px 10px 18px 10px;
        }

        legend{
            font-size:18px;
            font-weight:bold;
            padding:0 4px;
        }

        label{
            font-size:16px;
            display:block;
            margin-bottom:6px;
        }

        .txt{
            width:350px;
            height:28px;
            border:1px solid #bfbfbf;
            border-radius:3px;
            padding-left:8px;
            font-size:15px;
            margin-bottom:10px;
        }

        .blue{
            background:#dfe6f2;
        }

        .radio{
            margin-left:16px;
        }

        .datebox{
            position:relative;
            width:360px;
        }

        .date{
            width:350px;
            height:30px;
            border:1px solid #bfbfbf;
            border-radius:3px;
            padding-left:8px;
            font-size:15px;
        }

        .calendar{
            position:absolute;
            right:12px;
            top:8px;
            font-size:15px;
            color:#222;
        }

        .address{
            position:relative;
            width:360px;
        }

        textarea{
            width:350px;
            height:38px;
            border:1px solid #bfbfbf;
            border-radius:3px;
            padding:8px;
            font-size:15px;
            resize:none;
        }

        .icons{
            position:absolute;
            right:8px;
            bottom:8px;
            display:flex;
            gap:6px;
        }

        .icon{
            width:22px;
            height:22px;
            border-radius:50%;
            background:#0f8c8c;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:12px;
        }

        button{
            width:82px;
            height:38px;
            background:white;
            border:2px solid #4b4b4b;
            border-radius:4px;
            font-size:18px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="main">

        <form>

            <fieldset>

                <legend>User personal information</legend>

                <label>Enter your full name</label>

                <input type="text" value="Shivakant Kurmi"
                    class="txt blue">

                <label>Enter your email</label>

                <input type="email" value="shivakantkurmi49@gmail.com"
                    class="txt blue">

                <label>Enter your password</label>

                <input type="password"
                    class="txt">

                <label>Confirm your password</label>

                <input type="password"
                    class="txt">

                <label>Enter your gender</label>

                <div>

                    <input type="radio" name="gender" checked>Male

                    <input type="radio" name="gender"
                        class="radio">Female

                    <input type="radio" name="gender"
                        class="radio">Others

                </div>

                <br>

                <label>Enter your Date of Birth</label>

                <div class="datebox">

                    <input type="text"
                        value="10-06-2005"
                        class="date">

                    <i class="fa-regular fa-calendar calendar"></i>

                </div>

                <br>

                <label>Enter your Address:</label>

                <div class="address">

                    <textarea>Noida Sector 137</textarea>

                    <div class="icons">

                        <div class="icon">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>

                        <div class="icon">
                            <i class="fa-brands fa-google"></i>
                        </div>

                    </div>

                </div>

                <br><br>

                <button type="submit">
                    submit
                </button>

            </fieldset>

        </form>

    </div>

</body>

</html>
